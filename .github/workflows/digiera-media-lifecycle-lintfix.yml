name: DIGIERA Media lifecycle lint fix

on:
  push:
    branches:
      - feature/digiera-media-v1-rc1-lifecycle
    paths:
      - '.github/workflows/digiera-media-lifecycle-lintfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Fix confirmed max-len errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/lib/editor/tiny/plugins/digieramedia/amd/src/ui.js')
          text = path.read_text()

          replacements = {
              "                showStatus(root, `<div class=\"alert alert-danger py-2\">${escapeHtml(error?.message || 'Không thể đưa vào thùng rác.')}</div>`);": """                showStatus(
                      root,
                      `<div class=\"alert alert-danger py-2\">${escapeHtml(
                          error?.message || 'Không thể đưa vào thùng rác.'
                      )}</div>`
                  );""",
              "                showStatus(root, `<div class=\"alert alert-danger py-2\">${escapeHtml(error?.message || 'Khôi phục thất bại.')}</div>`);": """                showStatus(
                      root,
                      `<div class=\"alert alert-danger py-2\">${escapeHtml(
                          error?.message || 'Khôi phục thất bại.'
                      )}</div>`
                  );""",
              "                showStatus(root, `<div class=\"alert alert-danger py-2\">${escapeHtml(error?.message || 'Xóa vĩnh viễn thất bại.')}</div>`);": """                showStatus(
                      root,
                      `<div class=\"alert alert-danger py-2\">${escapeHtml(
                          error?.message || 'Xóa vĩnh viễn thất bại.'
                      )}</div>`
                  );""",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected source line not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          over = [(n, len(line)) for n, line in enumerate(text.splitlines(), 1) if len(line) > 132]
          if over:
              raise SystemExit(f'max-len remains: {over}')

          print('LIFECYCLE_UI_MAXLEN_FIX=PASS')
          PY

      - name: Verify ESLint and build AMD
        shell: bash
        run: |
          set -euo pipefail
          npx eslint public/lib/editor/tiny/plugins/digieramedia/amd/src/ui.js
          npx grunt amd --root=public/lib/editor/tiny/plugins/digieramedia
          grep -q 'local_digieramedia_get_media_usage' \
            public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'local_digieramedia_purge_media' \
            public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          echo 'LIFECYCLE_UI_AMD_BUILD=PASS'

      - name: Commit source and runtime fix
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            public/lib/editor/tiny/plugins/digieramedia/amd/src/ui.js
            public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          )
          git config user.name 'DIGIERA CI'
          git config user.email '84571199+Long2902@users.noreply.github.com'
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo 'LIFECYCLE_UI_FIX_ALREADY_COMMITTED=YES'
            exit 0
          fi
          git commit -m 'fix: satisfy TinyMCE lifecycle lint and runtime build'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'LIFECYCLE_UI_FIX_COMMIT=PASS'
