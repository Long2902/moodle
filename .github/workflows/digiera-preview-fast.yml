name: DIGIERA Preview Fast Gate

on:
  push:
    branches:
      - digiera/preview-v01
    paths:
      - 'public/local/digieranative/**'
      - 'public/local/digieraoffice/**'
      - 'public/local/worksheetlibrary/**'
      - 'public/mod/worksheetgrader/**'
      - '.github/workflows/digiera-preview-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digiera-preview-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public/local/digieranative/client/package-lock.json

      - name: PHP lint and XMLDB parse
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null
            count=$((count+1))
          done < <(find \
            public/local/digieranative \
            public/local/digieraoffice \
            public/local/worksheetlibrary \
            public/mod/worksheetgrader \
            -name '*.php' -print0)
          echo "PHP_LINT_FILES=$count"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              'public/local/worksheetlibrary/db/install.xml',
              'public/mod/worksheetgrader/db/install.xml',
          ]:
              ET.parse(path)
          print('XMLDB_PARSE=PASS')
          PY

      - name: Preview vertical-slice standalone contracts
        shell: bash
        run: |
          set -euo pipefail
          php public/local/digieranative/tests/standalone_validator.php
          php public/local/digieranative/tests/standalone_renderer.php
          php public/local/worksheetlibrary/tests/native_version_service_standalone.php
          node public/local/digieranative/client/tests/autosave-standalone.mjs
          python3 public/local/worksheetlibrary/tests/native_ui_contract.py
          php public/mod/worksheetgrader/tests/preview_vertical_slice_standalone.php
          python3 public/mod/worksheetgrader/tests/native_preview_ui_contract.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null
            count=$((count+1))
          done < <(find \
            public/local/digieranative \
            public/local/digieraoffice \
            public/local/worksheetlibrary \
            public/mod/worksheetgrader \
            -name '*.js' -print0)
          echo "JS_SYNTAX_FILES=$count"

      - name: Native JS tests and deterministic AMD build
        working-directory: public/local/digieranative/client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run build
          amd='../amd/build/native_editor.min.js'
          h1="$(sha256sum "$amd" | awk '{print $1}')"
          s1="$(stat -c '%s' "$amd")"
          npm run build
          h2="$(sha256sum "$amd" | awk '{print $1}')"
          s2="$(stat -c '%s' "$amd")"
          test "$h1" = "$h2"
          test "$s1" = "$s2"
          node --check "$amd"
          ! grep -a -q 'sourceMappingURL' "$amd"
          ! grep -a -q '/root/digiera' "$amd"
          grep -a -q 'createAutosaveController' "$amd"
          echo "AMD_SHA256=$h2"
          echo "AMD_BYTES=$s2"
          echo 'DETERMINISTIC_BUILD=PASS'
          npm audit --omit=dev

      - name: Preview source safety guards
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            public/local/digieranative
            public/local/digieraoffice
            public/local/worksheetlibrary
            public/mod/worksheetgrader
          )

          if grep -RIl \
            --exclude-dir=node_modules \
            'BEGIN RSA PRIVATE KEY\|BEGIN OPENSSH PRIVATE KEY\|BEGIN EC PRIVATE KEY' \
            "${roots[@]}"; then
            echo 'PRIVATE_KEY_LEAK=FAIL'
            exit 1
          fi

          if grep -RInaP \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            '(?i)(password|secret|api[_-]?key)\s*[:=]\s*["'"'][^"'"']{8,}["'"']' \
            "${roots[@]}"; then
            echo 'LITERAL_CREDENTIAL_LEAK=FAIL'
            exit 1
          fi

          if grep -RIl \
            --exclude-dir=node_modules \
            '/root/digiera' \
            "${roots[@]}"; then
            echo 'LOCAL_PATH_LEAK=FAIL'
            exit 1
          fi

          test -f public/mod/worksheetgrader/backup/moodle2/backup_worksheetgrader_activity_task.class.php
          test -f public/mod/worksheetgrader/backup/moodle2/restore_worksheetgrader_activity_task.class.php
          git diff --check HEAD~1 HEAD --
          echo 'SOURCE_SAFETY_GUARDS=PASS'
