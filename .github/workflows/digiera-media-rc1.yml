name: DIGIERA Media RC1 fast-track

on:
  push:
    branches:
      - feature/digiera-media-v1-rc1-fasttrack
      - feature/digiera-media-v1-rc1-versioning
      - feature/digiera-media-v1-rc1-lifecycle
    paths:
      - 'public/local/digieramedia/**'
      - 'public/filter/digieramedia/**'
      - 'public/lib/editor/tiny/plugins/digieramedia/**'
      - '.digiera/tests/digiera-media-rc1-contract.py'
      - '.digiera/tests/digiera-media-lifecycle-source-contract.sh'
      - '.digiera/tools/digiera-stage-seed-pdf.php'
      - '.digiera/tools/digiera-media-rc1-versioning-deploy.sh'
      - '.digiera/tools/digiera-media-rc1-reference-state-deploy.sh'
      - '.digiera/tools/digiera-media-rc1-lifecycle-deploy.sh'
      - '.digiera/rc1/**'
      - '.github/workflows/digiera-media-rc1.yml'
  workflow_dispatch:

concurrency:
  group: digiera-media-rc1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: MySQL 8.4
        uses: moodlehq/mysql-action@v1
        with:
          collation server: utf8mb4_bin
          mysql version: 8.4
          mysql database: test
          mysql user: test
          mysql password: test
          use tmpfs: true
          tmpfs size: '1024M'
          extra conf: --skip-log-bin
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          ini-values: max_input_vars=5000
          coverage: none
      - name: Checkout RC1 branch
        uses: actions/checkout@v4
      - name: RC1 source contract and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .digiera/tests/digiera-media-rc1-contract.py
          bash .digiera/tests/digiera-media-lifecycle-source-contract.sh
          php -l .digiera/tools/digiera-stage-seed-pdf.php
          bash -n .digiera/tools/digiera-media-rc1-versioning-deploy.sh
          bash -n .digiera/tools/digiera-media-rc1-reference-state-deploy.sh
          if test -f .digiera/tools/digiera-media-rc1-lifecycle-deploy.sh; then
            bash -n .digiera/tools/digiera-media-rc1-lifecycle-deploy.sh
          fi
          find public/local/digieramedia public/filter/digieramedia public/lib/editor/tiny/plugins/digieramedia -type f -name '*.php' -print0 | sort -z | xargs -0 -r -n1 php -l
          find public/lib/editor/tiny/plugins/digieramedia/amd/src -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check
      - name: Build TinyMCE AMD
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx grunt amd --root=public/lib/editor/tiny/plugins/digieramedia
          test -f public/lib/editor/tiny/plugins/digieramedia/amd/build/plugin.min.js
          test -f public/lib/editor/tiny/plugins/digieramedia/amd/build/modal.min.js
          test -f public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          test -f public/lib/editor/tiny/plugins/digieramedia/amd/build/upload_client.min.js
          test -f public/lib/editor/tiny/plugins/digieramedia/amd/build/reference_component.min.js
          grep -q '"./ui"' public/lib/editor/tiny/plugins/digieramedia/amd/build/commands.min.js
          grep -q '_exports.open' public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'local_digieramedia_create_upload_session' public/lib/editor/tiny/plugins/digieramedia/amd/build/upload_client.min.js
          grep -q 'local_digieramedia_update_reference_version' public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'local_digieramedia_get_media_usage' public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'local_digieramedia_trash_media' public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'local_digieramedia_restore_media' public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'local_digieramedia_purge_media' public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
          grep -q 'getSelectedReference' public/lib/editor/tiny/plugins/digieramedia/amd/build/reference_component.min.js
      - name: Commit generated TinyMCE AMD runtime
        if: github.ref_name == 'feature/digiera-media-v1-rc1-versioning' || github.ref_name == 'feature/digiera-media-v1-rc1-lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            public/lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js
            public/lib/editor/tiny/plugins/digieramedia/amd/build/reference_component.min.js
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'AMD_RUNTIME_ALREADY_COMMITTED=YES'
            exit 0
          fi
          git config user.name 'DIGIERA CI'
          git config user.email '84571199+Long2902@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'build: refresh lifecycle AMD runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'AMD_RUNTIME_COMMIT=PASS'
      - name: Set up Moodle PHPUnit
        env:
          dbtype: mysqli
        run: |
          echo "pathtophp=$(which php)" >> "$GITHUB_ENV"
          cp .github/workflows/config-template.php config.php
          mkdir -p ../moodledata
          sudo locale-gen en_AU.UTF-8
          php public/admin/tool/phpunit/cli/init.php --no-composer-self-update
      - name: Run DIGIERA Media runtime suite
        env:
          dbtype: mysqli
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            public/local/digieramedia/tests/schema_test.php
            public/local/digieramedia/tests/backup_manifest_test.php
            public/local/digieramedia/tests/reference_remapper_test.php
            public/local/digieramedia/tests/independent_copy_test.php
            public/local/digieramedia/tests/course_restore_integration_test.php
            public/local/digieramedia/tests/reference_version_state_test.php
            public/local/digieramedia/tests/lifecycle_service_test.php
            public/local/digieramedia/tests/usage_service_test.php
            public/filter/digieramedia/tests/text_filter_test.php
            public/filter/digieramedia/tests/text_filter_lifecycle_test.php
          )
          for testfile in "${tests[@]}"; do
            if test -f "$testfile"; then
              echo "===== $testfile ====="
              vendor/bin/phpunit "$testfile"
            fi
          done
      - name: Build reproducible RC1 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .digiera/dist/rc1
          rm -f .digiera/dist/rc1/*
          tar --sort=name --mtime='UTC 2026-09-07' --owner=0 --group=0 --numeric-owner -czf .digiera/dist/rc1/DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK.tgz -C public local/digieramedia filter/digieramedia lib/editor/tiny/plugins/digieramedia
          (cd .digiera/dist/rc1 && sha256sum DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK.tgz > DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK.sha256)
          cp .digiera/rc1/INSTALL_AND_SMOKE.md .digiera/dist/rc1/
          cp .digiera/tools/digiera-stage-seed-pdf.php .digiera/dist/rc1/
          printf 'source_commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .digiera/dist/rc1/BUILD_INFO.txt
      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          archive=.digiera/dist/rc1/DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK.tgz
          listing=.digiera/dist/rc1/DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK.contents.txt
          tar -tzf "$archive" > "$listing"
          grep -Fxq 'local/digieramedia/version.php' "$listing"
          grep -Fxq 'filter/digieramedia/version.php' "$listing"
          grep -Fxq 'lib/editor/tiny/plugins/digieramedia/version.php' "$listing"
          grep -Fxq 'lib/editor/tiny/plugins/digieramedia/amd/build/plugin.min.js' "$listing"
          grep -Fxq 'lib/editor/tiny/plugins/digieramedia/amd/build/modal.min.js' "$listing"
          grep -Fxq 'lib/editor/tiny/plugins/digieramedia/amd/build/ui.min.js' "$listing"
          grep -Fxq 'lib/editor/tiny/plugins/digieramedia/amd/build/upload_client.min.js' "$listing"
          grep -Fxq 'lib/editor/tiny/plugins/digieramedia/amd/build/reference_component.min.js' "$listing"
          test -f .digiera/dist/rc1/digiera-stage-seed-pdf.php
          test -f .digiera/dist/rc1/BUILD_INFO.txt
          (cd .digiera/dist/rc1 && sha256sum -c DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK.sha256)
      - name: Upload RC1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIGIERA_MEDIA_MOODLE51_RC1_FASTTRACK
          path: .digiera/dist/rc1/*
          if-no-files-found: error
          retention-days: 14
