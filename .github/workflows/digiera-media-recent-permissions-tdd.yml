name: DIGIERA Media recent permissions TDD

on:
  push:
    branches:
      - feature/digiera-media-v1-rc1-recent-permissions
    paths:
      - 'public/local/digieramedia/**'
      - '.github/workflows/digiera-media-recent-permissions-tdd.yml'
  workflow_dispatch:

concurrency:
  group: digiera-media-recent-permissions-tdd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: MySQL 8.4
        uses: moodlehq/mysql-action@v1
        with:
          collation server: utf8mb4_bin
          mysql version: 8.4
          mysql database: test
          mysql user: test
          mysql password: test
          use tmpfs: true
          tmpfs size: '1024M'
          extra conf: --skip-log-bin
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          ini-values: max_input_vars=5000
          coverage: none
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/local/digieramedia -type f -name '*.php' -print0 | sort -z | xargs -0 -r -n1 php -l
      - name: Set up Moodle PHPUnit
        env:
          dbtype: mysqli
        run: |
          echo "pathtophp=$(which php)" >> "$GITHUB_ENV"
          cp .github/workflows/config-template.php config.php
          mkdir -p ../moodledata
          sudo locale-gen en_AU.UTF-8
          php public/admin/tool/phpunit/cli/init.php --no-composer-self-update
      - name: Run focused recent and permission tests
        env:
          dbtype: mysqli
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            public/local/digieramedia/tests/schema_test.php
            public/local/digieramedia/tests/recent_service_test.php
            public/local/digieramedia/tests/recent_external_test.php
            public/local/digieramedia/tests/permission_matrix_test.php
            public/local/digieramedia/tests/lifecycle_service_test.php
          )
          for testfile in "${tests[@]}"; do
            if test -f "$testfile"; then
              echo "===== $testfile ====="
              vendor/bin/phpunit "$testfile"
            fi
          done
