name: DIGIERA Media CI

on:
  push:
    branches:
      - feature/digiera-media-v1-ci
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - name: Setting up DB mysql
        uses: moodlehq/mysql-action@v1
        with:
          collation server: utf8mb4_bin
          mysql version: 8.4
          mysql database: test
          mysql user: test
          mysql password: test
          use tmpfs: true
          tmpfs size: '1024M'
          extra conf: --skip-log-bin

      - name: Setting up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          ini-values: max_input_vars=5000
          coverage: none

      - name: Checking out exact CI branch
        uses: actions/checkout@v4

      - name: Setting up Moodle PHPUnit
        env:
          dbtype: mysqli
        run: |
          echo "pathtophp=$(which php)" >> $GITHUB_ENV
          cp .github/workflows/config-template.php config.php
          mkdir ../moodledata
          sudo locale-gen en_AU.UTF-8
          php public/admin/tool/phpunit/cli/init.php --no-composer-self-update

      - name: Run DIGIERA Media schema tests
        env:
          dbtype: mysqli
        run: vendor/bin/phpunit public/local/digieramedia/tests/schema_test.php

      - name: Verify clean tree
        run: git status --short