name: DIGIERA Tiptap V1 CI

on:
  push:
    branches:
      - digiera/tiptap-v1-ci
    paths:
      - tools/digiera-tiptap-v1.patch.gz
      - tools/digiera-tiptap-run6-fix.patch
      - .github/workflows/digiera-tiptap-v1-ci.yml

permissions:
  contents: write

jobs:
  tiptap-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply isolated Tiptap V1 patch
        run: |
          test -f tools/digiera-tiptap-v1.patch.gz
          test -f tools/digiera-tiptap-run6-fix.patch
          sha256sum tools/digiera-tiptap-v1.patch.gz
          gzip -dc tools/digiera-tiptap-v1.patch.gz > /tmp/digiera-tiptap-v1.patch
          sha256sum /tmp/digiera-tiptap-v1.patch
          sha256sum tools/digiera-tiptap-run6-fix.patch
          git apply --check /tmp/digiera-tiptap-v1.patch
          git apply /tmp/digiera-tiptap-v1.patch
          git apply --check tools/digiera-tiptap-run6-fix.patch
          git apply tools/digiera-tiptap-run6-fix.patch
          echo TIPTAP_V1_PATCH_APPLY=PASS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public/local/digieranative/client/package-lock.json

      - name: Regenerate Tiptap lock
        working-directory: public/local/digieranative/client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        working-directory: public/local/digieranative/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Native tests
        working-directory: public/local/digieranative/client
        run: npm test

      - name: Standalone and static contracts
        run: |
          node public/local/digieranative/client/tests/tiptap-adapter-standalone.mjs
          python3 public/local/digieranative/tests/tiptap_hybrid_static_contract.py

      - name: JS syntax
        run: |
          node --check public/local/digieranative/client/src/editor.js
          node --check public/local/digieranative/client/src/ribbon.js
          node --check public/local/digieranative/client/src/tiptap_extensions.js
          node --check public/local/digieranative/client/src/paste.js
          node --check public/local/worksheetlibrary/amd/src/native_editor.js
          node --check public/mod/worksheetgrader/amd/src/native_attempt.js

      - name: Deterministic Rollup build
        working-directory: public/local/digieranative/client
        run: |
          npm run build
          sha256sum ../amd/build/native_editor.min.js | tee /tmp/build1.sha
          cp ../amd/build/native_editor.min.js /tmp/native_editor.min.js.first
          npm run build
          sha256sum ../amd/build/native_editor.min.js | tee /tmp/build2.sha
          cmp /tmp/native_editor.min.js.first ../amd/build/native_editor.min.js
          echo DETERMINISTIC_TIPTAP_BUILD=PASS

      - name: Commit verified product source and generated outputs
        run: |
          test "$(sha256sum public/local/digieranative/client/package-lock.json | awk '{print $1}')" = "bd28c54a123ae1da0895c60dcc34db8710732e00cb8dffc9c6280810aab7b473"
          test "$(sha256sum public/local/digieranative/amd/build/native_editor.min.js | awk '{print $1}')" = "448f5386ae4213ecf0695c6a7591a3578a90b1c05db748b89e507fff9c7528f7"
          git config user.name 'DIGIERA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add public/local/digieranative public/local/worksheetlibrary public/mod/worksheetgrader
          if git diff --cached --name-only | grep -Ev '^(public/local/digieranative/|public/local/worksheetlibrary/|public/mod/worksheetgrader/)' ; then
            echo 'OUT_OF_SCOPE_STAGED_FILE=FAIL'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'feat(tiptap): materialize verified V1 product source [skip ci]'
          git push origin HEAD:digiera/tiptap-v1-ci
          echo VERIFIED_PRODUCT_SOURCE_COMMITTED=PASS

      - name: Package CI outputs
        run: |
          mkdir -p /tmp/tiptap-ci-output/public/local/digieranative/client
          mkdir -p /tmp/tiptap-ci-output/public/local/digieranative/amd/build
          cp public/local/digieranative/client/package-lock.json /tmp/tiptap-ci-output/public/local/digieranative/client/package-lock.json
          cp public/local/digieranative/amd/build/native_editor.min.js /tmp/tiptap-ci-output/public/local/digieranative/amd/build/native_editor.min.js
          sha256sum /tmp/tiptap-ci-output/public/local/digieranative/client/package-lock.json
          sha256sum /tmp/tiptap-ci-output/public/local/digieranative/amd/build/native_editor.min.js

      - name: Upload Tiptap CI output
        uses: actions/upload-artifact@v4
        with:
          name: digiera-tiptap-v1-ci-output
          path: /tmp/tiptap-ci-output
          if-no-files-found: error
